<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGFS - Painel do Vendedor</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="SellerMainScreenStyle.css">
</head>
<body>

    <header class="header">
        <div class="header_logo">
            <h1><i data-lucide="package"></i>SGFS</h1>
        </div>

        <button class="perfil-usuario">
            <div class="avatar"></div>
            
            <div class="perfil-usuario__dados">
                <span class="perfil-usuario__nome">Felipe Matias <span class="perfil-usuario__id">(ID: 71)</span></span>
                <span class="perfil-usuario__loja">Loja 02 ▾</span>
            </div>
        </button>
    </header>

    <main class="container">
        
        <section class="card-padrao">
            <h2 class="titulo-sessao">Novo Registro</h2>
            
            <div class="seletor-tipo">
                
                <label class="radio-custom">
                    <input type="radio" name="TipoRegistro" value="falta" checked onchange="toggleQuantidade()">
                    <span class="btn-base btn-bloco btn-estado-falta">Faltas</span>
                </label>

                <label class="radio-custom">
                    <input type="radio" name="TipoRegistro" value="sobra" onchange="toggleQuantidade()">
                    <span class="btn-base btn-bloco btn-estado-sobra">Sobra</span>
                </label>

            </div>
			<div class="campo-grupo">
			<label for="produtoInput" class="campo-label">Produto</label>
			<input type="text" id="produtoInput" class="input-padrao" placeholder="Ex: Tubo esgoto 100m..." autocomplete="off">
			</div>
			
			<div id="divQuantidade">
			<label for="quantidadeInput" class="campo-label">Quantidade (Unidades)</label>
			<input type="number" id="quantidadeInput" class="input-padrao" min="1" placeholder="Ex: 12">
			</div>

            <div class="campo-grupo">
                <label for="especialInput" class="checkbox-alerta">
                    <input type="checkbox" id="especialInput">
                    <span>Pedido Especial / Grande Volume</span>
                </label>
            </div>

            <button type="button" id="btnLancar" class="btn-base btn-primario btn-bloco" onclick="LancarNoSistema()">
                <i data-lucide="send"></i> Lançar no Sistema
            </button>
			
        </section>

        <section class="card-padrao" style="margin-top: 20px;">
            
            <div class="cabecalho-abas">
                <button id="btn-tab-faltas" class="aba aba-ativa" onclick="mudarAba('faltas')">Faltas Lançadas</button>
                <button id="btn-tab-sobras" class="aba" onclick="mudarAba('sobras')">Sobras Lançadas</button>
            </div>

            <div id="tab-faltas" class="conteudo-aba">
                <ul class="lista-itens" id="lista-faltas">
                    <li class="item-lista" data-id="123">
    
    <div class="item-resumo" onclick="toggleGaveta('123')">
        <i data-lucide="alert-triangle" style="color:#ca8004;"></i>
        <span class="badge badge-falta">Falta: 12</span>
        <div class="nome-produto" style="flex:1; font-weight:bold;">Tubo Tigre 100m</div>
        <span style="color:#666; font-size:12px;">#cod: 78945</span>
        </div>

        <div id="detalhes-123" class="item-detalhes oculto" >
            <div class="data">
                <div class="date">17/04</div>
                <div class="accountID">ID:71</div>
            </div>
            
            <div class="actions">
                <button class="btn-acao btn-editar" onclick="abrirModal('123')">
                    <i data-lucide="pencil"></i>
                </button>
                <button class="btn-acao btn-apagar" onclick="apagarItem('123')">
                    <i data-lucide="trash-2"></i>
                </button>
            </div>
        </div>
</li>
                </ul>
            </div>

            <div id="tab-sobras" class="conteudo-aba oculto">
            <ul class="lista-itens" id="lista-sobras">

                <li class="item-lista" data-id="123">
    
    <div class="item-resumo">
        </div>

    <div class="item-detalhes oculto">
        </div>

</li>

            </ul>    
            </div>
                

        </section>
<div id="modalEdicao" class="modal-overlay oculto">
        <div class="modal-caixa">
            
            <div class="modal-cabecalho">
                <h3 style="margin: 0;">Editar Lançamento</h3>
                <button class="btn-fechar-modal" onclick="fecharModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="modal-corpo">
                <input type="hidden" id="editIdPedido">

                <div class="campo-grupo">
                    <label class="campo-label">Produto</label>
                    <input type="text" id="editProdutoInput" class="input-padrao" autocomplete="off">
                </div>
                
                <div class="campo-grupo">
                    <label class="campo-label">Quantidade (Unidades)</label>
                    <input type="number" id="editQuantidadeInput" class="input-padrao" min="1">
                </div>

                <div class="campo-grupo">
                    <label class="checkbox-alerta">
                        <input type="checkbox" id="editEspecialInput">
                        <span>Pedido Especial / Grande Volume</span>
                    </label>
                </div>
            </div>

            <div class="modal-rodape">
                <button type="button" class="btn-base btn-bloco btn-confirmar-edicao" onclick="salvarEdicao()">
                    <i data-lucide="check"></i> Confirmar Alterações
                </button>
            </div>

        </div>
    </div>
    </main>
    <address>Email: felipempereira1999@gmail.com</address>
<script src="SellerMainScreenScript.js"></script>
</body>
</html>
