<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGFS - Login</title>
    
    <!-- CSS vindo do Tailwind -->
    <link href="./style.css" rel="stylesheet">
    
    <!-- Ícones do Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<!-- O fundo agora é um degradê que se move -->
<body class="min-h-screen flex items-center justify-center font-sans bg-gradient-to-br from-gray-600 via-blue-400 to-gray-600 bg-[length:400%_400%] animate-gradient-x">

    <!-- TELA DE LOGIN -->
    <!-- opacidade adicionada que da o efeito de vidro-->
    <div id="login-screen" class="card w-96 bg-base-100/90 backdrop-blur-md shadow-2xl border border-white/10 rounded-md p-4">
        
        <div class="card-body items-center text-center">
            
            <i data-lucide="package" class="w-16 h-16 text-primary text-white mb-2"></i>
            
            <h2 class="card-title text-2xl font-bold text-white">SGFS</h2>
            <p class="text-sm text-base-content/70 mb-8 text-white">Auditoria e Reposição</p>
            
            <div class="form-control w-full">
                <input type="text" id="input-id"  placeholder="ID do Usuário" class="input input-bordered input-primary w-full text-center text-lg font-bold " />
            </div>
            
            <div class="form-control w-full mt-2">
                <input type="password" id="input-senha" placeholder="Senha" class="input input-bordered input-primary w-full text-center text-lg font-bold" />
            </div>

            <div class="form-control w-full mt-6">
             
                <button id="btn-entrar" class="btn btn-primary w-full text-lg bg-white text-gray-400  text-center  font-bold">Entrar no Sistema</button>
            </div>
            
        </div>
    </div>

    <!-- Faz os ícones aparecerem -->
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="./script.js">
        
    </script>
</body>
</html>
